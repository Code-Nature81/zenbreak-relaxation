<title>Activation ZenBreak — code établissement</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff;text-align:center;
    background:radial-gradient(900px 700px at 20% 10%,rgba(20,110,130,.55),transparent 60%),
               linear-gradient(180deg,#071a2c 0%,#06142a 55%,#081b3d 100%);}
  .carte{max-width:420px;width:100%}
  img{width:96px;height:auto;margin-bottom:10px}
  h1{font-size:26px;font-weight:800;letter-spacing:-.3px}
  p.sous{color:#9fb6c4;margin:10px 0 24px;font-size:15px;line-height:1.45}
  input{width:100%;padding:16px;border-radius:12px;border:2px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.06);color:#fff;font-size:20px;letter-spacing:2px;text-align:center;
    text-transform:uppercase;outline:none}
  input:focus{border-color:#FFD700}
  input::placeholder{color:rgba(255,255,255,.3);letter-spacing:1px}
  button{width:100%;margin-top:14px;padding:16px;border:0;border-radius:12px;font-size:17px;font-weight:800;
    color:#06142a;background:linear-gradient(90deg,#FFD700,#FFA500);cursor:pointer}
  button:disabled{background:#6b7785;color:#1b2533;cursor:default}
  .msg{margin-top:18px;font-size:15px;line-height:1.5;min-height:1.5em}
  .msg.erreur{color:#FF8A80}
  .msg.ok{color:#7CF0C4;font-size:17px;font-weight:700}
  .msg .retour{display:block;margin-top:8px;color:#cfe3ea;font-weight:400;font-size:15px}
  small{display:block;margin-top:30px;color:#5f7d8d;font-size:13px}
  small a{color:#7fb3c4}
</style>

  <h1>Code établissement</h1>
  <p class="sous" id="sous">Saisissez le code fourni par votre établissement pour activer ZenBreak PRO sur votre téléphone.</p>

  <form id="formulaire" autocomplete="off">
    <input id="code" name="code" maxlength="40" placeholder="EX : ZEN-XXXX-XXXX"
           autocapitalize="characters" autocorrect="off" spellcheck="false" required>
    <button id="bouton" type="submit">Activer</button>
  </form>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>

  <small>ZenBreak · Code Nature · <a href="https://www.zenbreak-app.fr/">zenbreak-app.fr</a></small>
</main>

<script>
(function () {
  var URL_FONCTION = "https://us-central1-zenbreak-app-fc557.cloudfunctions.net/activerCodeWeb";
  var ticket = new URLSearchParams(location.search).get("t") || "";
  var form = document.getElementById("formulaire");
  var champ = document.getElementById("code");
  var bouton = document.getElementById("bouton");
  var msg = document.getElementById("msg");

  function afficher(texte, type) {
    msg.className = "msg " + (type || "");
    msg.innerHTML = texte;
  }
  function date(ms) {
    var d = new Date(ms);
    return ("0" + d.getDate()).slice(-2) + "/" + ("0" + (d.getMonth() + 1)).slice(-2) + "/" + d.getFullYear();
  }
  var MESSAGES = {
    invalide: "Ce code n'existe pas. Vérifiez l'orthographe.",
    expire: "Ce code a expiré. Contactez votre établissement.",
    complet: "Ce code a déjà atteint son nombre maximum d'appareils.",
    desactive: "Ce code n'est plus actif. Contactez votre établissement.",
    ticket_invalide: "Ce lien a expiré (il est valable 15 minutes et ne sert qu'une fois).<br>" +
      "Retournez dans l'app ZenBreak et appuyez à nouveau sur « J'ai un code établissement »."
  };

  // Page ouverte sans passer par l'app
  if (!/^[A-Za-z0-9]{15,40}$/.test(ticket)) {
    form.style.display = "none";
    document.getElementById("sous").textContent = "";
    afficher("Pour activer un code, ouvrez cette page depuis l'app ZenBreak :<br>" +
      "écran PRO → « J'ai un code établissement ».", "erreur");
    return;
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var code = champ.value.trim().toUpperCase();
    if (!code) { afficher("Saisissez votre code.", "erreur"); return; }
    bouton.disabled = true;
    bouton.textContent = "Vérification…";
    afficher("");

    fetch(URL_FONCTION, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ticket: ticket, code: code })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var statut = data && data.statut;
        if (statut === "ok" || statut === "deja_active") {
          form.style.display = "none";
          afficher("🎉 Code activé ! ZenBreak PRO est débloqué" +
            (data.dateFin ? " jusqu'au " + date(data.dateFin) : "") + "." +
            "<span class=\"retour\">Vous pouvez revenir dans l'app ZenBreak.</span>", "ok");
        } else {
          afficher(MESSAGES[statut] || "Une erreur est survenue. Réessayez dans un instant.", "erreur");
          if (statut === "ticket_invalide") form.style.display = "none";
          bouton.disabled = false;
          bouton.textContent = "Activer";
        }
      })
      .catch(function () {
        afficher("Pas de connexion internet. Réessayez dans un instant.", "erreur");
        bouton.disabled = false;
        bouton.textContent = "Activer";
      });
  });
})();
</script>
</body>
</html>
